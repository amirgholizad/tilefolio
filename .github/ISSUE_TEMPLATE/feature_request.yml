name: Feature request
description: Suggest an improvement to the template
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: What problem does it solve for people using the template?
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can be done without adding a build step or new dependencies
